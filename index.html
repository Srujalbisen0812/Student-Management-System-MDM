<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Register</h1>
    <p id="summary" aria-live="polite"></p>
  </header>

  <main>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Add student</h2>
      <form id="form" novalidate>
        <label>Name
          <input name="name" autocomplete="off" required>
          <small class="err" data-for="name"></small>
        </label>
        <label>Roll no
          <input name="roll_no" autocomplete="off" required>
          <small class="err" data-for="roll_no"></small>
        </label>
        <div class="two">
          <label>Class
            <input name="class" placeholder="e.g. 10-B" autocomplete="off" required>
            <small class="err" data-for="class"></small>
          </label>
          <label>Marks (0–100)
            <input name="marks" type="number" step="0.1" min="0" max="100" required>
            <small class="err" data-for="marks"></small>
          </label>
        </div>
        <label>Contact
          <input name="contact" inputmode="numeric" maxlength="10" placeholder="10 digits" autocomplete="off" required>
          <small class="err" data-for="contact"></small>
        </label>
        <div class="actions">
          <button type="submit" id="save">Add student</button>
          <button type="button" id="cancel" class="ghost" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="list" aria-labelledby="list-title">
      <h2 id="list-title" class="sr">Students</h2>
      <input id="search" type="search" placeholder="Search by name or roll no" aria-label="Search students">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Roll no</th><th>Name</th><th>Class</th><th>Marks</th><th>Contact</th><th><span class="sr">Actions</span></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" hidden></p>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
